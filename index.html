<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Underwriting Finder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: client panel (age, tobacco, conditions) on the left, verdict + carrier cards on the right; stacks on phones */
:root{
  --bg:#f3f4f1; --panel:#ffffff; --ink:#17191c; --muted:#5d636b; --line:#dcdfd9; --soft:#eceee9;
  --hover:#eaf1f8; --shadow:rgba(20,30,40,.07); --chip:#f6f7f4;
  --best:#16704a; --std:#215e9c; --graded:#9b5d07; --gi:#585f6e; --unknown:#7c838c; --decline:#b3261e;
  --best-bg:#e7f3ec; --std-bg:#e6eef7; --graded-bg:#f7eedd; --gi-bg:#eceef1; --decline-bg:#f8e7e5;
  --focus:#215e9c;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141619; --panel:#1d2024; --ink:#e9eae6; --muted:#a3a8ae; --line:#33373d; --soft:#272a2f;
  --hover:#243041; --shadow:rgba(0,0,0,.35); --chip:#23262b;
  --best:#5fc790; --std:#7db2ea; --graded:#e6aa4f; --gi:#a7adb9; --unknown:#8e949c; --decline:#f08a82;
  --best-bg:#17301f; --std-bg:#172636; --graded-bg:#33270f; --gi-bg:#24272c; --decline-bg:#3a1c1a;
  --focus:#7db2ea; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141619; --panel:#1d2024; --ink:#e9eae6; --muted:#a3a8ae; --line:#33373d; --soft:#272a2f;
  --hover:#243041; --shadow:rgba(0,0,0,.35); --chip:#23262b;
  --best:#5fc790; --std:#7db2ea; --graded:#e6aa4f; --gi:#a7adb9; --unknown:#8e949c; --decline:#f08a82;
  --best-bg:#17301f; --std-bg:#172636; --graded-bg:#33270f; --gi-bg:#24272c; --decline-bg:#3a1c1a;
  --focus:#7db2ea; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
[hidden]{display:none!important}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
header{background:var(--panel);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:baseline;justify-content:space-between;gap:6px 16px;flex-wrap:wrap;padding-block:14px}
h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
.src{color:var(--muted);font-size:13px}
main.wrap{display:grid;grid-template-columns:360px minmax(0,1fr);gap:28px;padding-block:22px 64px}
@media (max-width:860px){main.wrap{grid-template-columns:minmax(0,1fr);gap:20px}}

/* ---------- panel ---------- */
aside{align-self:start;position:sticky;top:16px;display:grid;gap:14px}
@media (max-width:860px){aside{position:static}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.box h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 12px}
.client{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}
.fl{display:block;font-size:14px;font-weight:500;margin-bottom:5px}
input[type=text],input[type=number],select{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.tob{display:flex;align-items:center;gap:10px;font-size:15px;min-height:46px;padding:0 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;user-select:none}
.tob input{width:19px;height:19px;margin:0;accent-color:var(--decline)}
.tob:has(input:checked){border-color:var(--decline);color:var(--decline);font-weight:600}
.search{position:relative}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:8px;max-height:340px;overflow:auto;z-index:5;box-shadow:0 10px 28px var(--shadow)}
.sugg div{padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--soft);font-size:15px}
.sugg div:last-child{border-bottom:0}
.sugg div.act,.sugg div:hover{background:var(--hover)}
.sugg .none{color:var(--muted);cursor:default}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.quick button{font:inherit;font-size:13.5px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--chip);color:var(--ink);cursor:pointer}
.quick button:hover{border-color:var(--muted)}
.quick-label{font-size:12.5px;color:var(--muted);margin-top:12px}
.picked{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.picked li{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--chip)}
.picked .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.picked .nm{font-weight:600;font-size:15px;min-width:0}
.picked .rm{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:0 2px;margin-top:-2px}
.picked .rm:hover{color:var(--decline)}
.picked .when{display:block;font-size:13px;color:var(--muted);margin-top:8px}
.picked .when select{margin-top:4px;font-size:15px;padding:8px 10px}
.picked .when.unset select{border-color:var(--graded)}
.picked .empty{background:none;border-style:dashed;color:var(--muted);font-size:14px}
.reset{font:inherit;font-size:14px;background:none;border:0;color:var(--muted);cursor:pointer;text-decoration:underline;justify-self:start;padding:0}

/* ---------- results ---------- */
#out{min-width:0;display:grid;gap:22px;align-content:start}
.intro h2{font-size:22px;margin:0 0 8px;text-wrap:balance}
.intro p{margin:0 0 14px;color:var(--muted);max-width:60ch}
.legend{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.legend li{display:grid;grid-template-columns:150px 1fr;gap:12px;font-size:14.5px;align-items:baseline}
.legend b{color:var(--c)}
@media (max-width:520px){.legend li{grid-template-columns:1fr;gap:0}}

.verdict{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.verdict .top{background:var(--cbg);padding:18px 20px}
.verdict .eyebrow{font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--c);margin:0 0 4px}
.verdict h2{font-size:24px;line-height:1.2;margin:0;text-wrap:balance}
.verdict .cls{font-size:19px;font-weight:700;color:var(--c);margin-top:4px}
.verdict .what{color:var(--ink);font-size:15px;margin-top:2px}
.verdict .facts{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14.5px;margin-top:10px}
.verdict .facts b{font-weight:600}
.also{padding:6px 20px 12px}
.also h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 0 4px}
.also .ln{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:9px 0;border-top:1px solid var(--soft);font-size:15px}
.also .ln:first-of-type{border-top:0}
.also .ln span:last-child{font-weight:600;color:var(--c);text-align:right}
.also .ln small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.none-fit{padding:18px 20px}

section.tier > h2{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:18px;margin:0 0 2px;color:var(--c)}
section.tier > h2 span{font-size:14px;font-weight:400;color:var(--muted)}
section.tier > p{margin:0 0 12px;color:var(--muted);font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
@media (max-width:420px){.cards{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{margin:0;font-size:16.5px;line-height:1.3}
.card .cls{font-size:20px;font-weight:700;color:var(--c);line-height:1.2}
.card .cls small{display:block;font-size:13.5px;font-weight:400;color:var(--muted);margin-top:2px}
.card .cov{font-size:14.5px}
.card .cov b{font-weight:600}
.why{list-style:none;margin:0;padding:10px 0 0;border-top:1px solid var(--soft);display:grid;gap:5px;font-size:14px}
.why li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.why li span:first-child{color:var(--muted);overflow-wrap:anywhere}
.why li span:last-child{font-weight:600;color:var(--rc,var(--ink));text-align:right}
.warn{font-size:13.5px;background:var(--graded-bg);color:var(--ink);border-radius:6px;padding:8px 10px}
details.rules{font-size:13.5px}
details.rules summary{cursor:pointer;color:var(--std);font-weight:500;padding:2px 0}
.mem{margin-top:10px}
.mem h4{margin:0 0 4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.mem h4 span{text-transform:none;letter-spacing:0;font-weight:400}
.rule{padding:4px 0;border-top:1px dashed var(--soft)}
.rule .cn{display:block;color:var(--muted);font-size:12.5px}
.rule .rt{color:var(--rc,var(--ink))}

.nofit{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.nofit > summary{cursor:pointer;padding:14px 16px;font-weight:600;font-size:15px}
.nofit > summary span{font-weight:400;color:var(--muted)}
.nofit .body{padding:0 16px 14px;display:grid;gap:14px}
.nofit h4{margin:0 0 4px;font-size:14px;color:var(--c)}
.nofit ul{margin:0;padding-left:18px;font-size:14px;display:grid;gap:3px}
.nofit ul small{color:var(--muted)}
.foot{color:var(--muted);font-size:12.5px;margin:6px 0 0}

.t-best{--c:var(--best);--cbg:var(--best-bg);--rc:var(--best)}
.t-std{--c:var(--std);--cbg:var(--std-bg);--rc:var(--std)}
.t-graded{--c:var(--graded);--cbg:var(--graded-bg);--rc:var(--graded)}
.t-gi{--c:var(--gi);--cbg:var(--gi-bg);--rc:var(--gi)}
.t-decline{--c:var(--decline);--cbg:var(--decline-bg);--rc:var(--decline)}
.t-unknown{--c:var(--unknown);--rc:var(--muted)}
@media (prefers-reduced-motion:no-preference){.card,.verdict{transition:border-color .15s}}
</style>
<style>
[hidden]{display:none!important}
.gate{max-width:380px;margin:12vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px}
.gate h2{margin:0 0 4px;font-size:17px}
.gate p{margin:0 0 14px;color:var(--muted);font-size:14px}
.gate form{display:grid;gap:10px}
.gate button{font:inherit;font-weight:600;padding:10px;border:0;border-radius:6px;background:var(--std);color:var(--panel);cursor:pointer}
.gate button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.gate .err{color:var(--decline);font-size:13.5px;min-height:1.2em;margin:0}
</style>


<header><div class="wrap">
  <h1>Underwriting Finder</h1>
  <span class="src" id="src"></span>
</div></header>


<div class="wrap" id="gate"><div class="gate">
  <h2>Enter passcode</h2>
  <p>This finder is private. Ask Samir for the passcode.</p>
  <form id="gateform">
    <input id="gatepw" type="password" autocomplete="current-password" placeholder="Passcode" required>
    <button type="submit" id="gatebtn">Unlock</button>
    <p class="err" id="gateerr" role="alert"></p>
  </form>
</div></div>
<main class="wrap" id="app" hidden>
<aside>
  <div class="box">
    <h2>Client</h2>
    <div class="client">
      <div>
        <label class="fl" for="age">Age</label>
        <input id="age" type="number" min="0" max="100" inputmode="numeric" placeholder="67">
      </div>
      <label class="tob" for="tob"><input id="tob" type="checkbox"> Uses tobacco</label>
    </div>
  </div>

  <div class="box">
    <h2>Health history</h2>
    <label class="fl" for="q">Add a condition</label>
    <div class="search">
      <input id="q" type="text" autocomplete="off" placeholder="Try afib, copd, stroke, insulin">
      <div class="sugg" id="sugg" role="listbox" hidden></div>
    </div>
    <div class="quick-label">Common</div>
    <div class="quick" id="quick"></div>
    <ul class="picked" id="picked"></ul>
  </div>

  <button class="reset" id="clear" type="button">Clear and start a new client</button>
</aside>

<div id="out"></div>
</main>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY = "uwf-pass";
async function unlock(pw){
  const k0 = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(P.salt), iterations:P.it, hash:"SHA-256"}, k0, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.iv)}, k, b64(P.ct));
  return new TextDecoder().decode(pt);
}
async function tryPass(pw){
  let src;
  try { src = await unlock(pw); } catch (e) { return false; }
  try { localStorage.setItem(KEY, pw); } catch (e) {}
  document.getElementById("gate").hidden = true;
  document.getElementById("app").hidden = false;
  const s = document.createElement("script"); s.textContent = src; document.body.appendChild(s);
  return true;
}
document.getElementById("gateform").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("gatebtn"), err = document.getElementById("gateerr");
  btn.disabled = true; btn.textContent = "Checking..."; err.textContent = "";
  const ok = await tryPass(document.getElementById("gatepw").value);
  if (!ok){ err.textContent = "Wrong passcode. Try again."; btn.disabled = false; btn.textContent = "Unlock"; }
});
let saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
if (saved) tryPass(saved).then(ok => { if (!ok) try { localStorage.removeItem(KEY); } catch (e) {} });
